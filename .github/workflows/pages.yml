name: Deploy PrismLab to Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Verify PrismLab]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prismlab-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_BASE_PATH: /PrismLab-DV
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: artifact
        with:
          path: out
      - name: Deploy uploaded Pages artifact
        uses: actions/github-script@v9
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error("The Pages upload did not return an artifact ID.");
            }
            // Use the uploaded ID directly. The Actions artifact list can lag the upload.
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: oidcToken,
            });
            const deploymentId = deployment.id || context.sha;
            const failures = new Set(["deployment_failed", "deployment_content_failed", "deployment_cancelled", "deployment_lost"]);
            for (let attempt = 0; attempt < 36; attempt++) {
              const { data } = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}", {
                ...context.repo, deploymentId,
              });
              if (data.status === "succeed") {
                core.setOutput("page_url", deployment.page_url);
                core.info("Published " + deployment.page_url);
                return;
              }
              if (failures.has(data.status)) throw new Error("Pages reported " + data.status);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("Pages did not finish deploying within six minutes.");
